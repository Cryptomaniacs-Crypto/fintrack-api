# COPY this file to secrets.yml and modify as needed.
# config/secrets.yml is gitignored — never commit real secrets.
# In production, set these as Heroku config vars instead of using this file.

development:
  DATABASE_URL: sqlite://db/local/development.db
  SECURE_DB_KEY: <run `rake newkey:db` to generate>
  SECURE_HASH_KEY: <run `rake newkey:hash` to generate>
  TOKEN_KEY: <run `rake newkey:token` to generate>
  SECURE_SCHEME: HTTP
  RESEND_API_URL: https://api.resend.com/emails
  RESEND_API_KEY: <set in env>
  RESEND_FROM_EMAIL: <sender@yourdomain.com>
  RESEND_FROM_NAME: Fintrack-Demo
  # OAuth client id of a Web-application client; used only to verify the
  # id_token `aud` claim. The API never needs the client secret.
  # See setup_oidc.md for Google Cloud Console setup instructions.
  GOOGLE_CLIENT_ID: <Google OAuth client id, type Web application>
  # Public half of the signing keypair (`rake newkey:signing`). The private
  # SIGNING_KEY half lives only in the Web App, so the API can verify signed
  # requests but never forge them.
  VERIFY_KEY: <public half from `rake newkey:signing`>

test:
  DATABASE_URL: sqlite://db/local/test.db
  SECURE_DB_KEY: <run `rake newkey:db` to generate>
  SECURE_HASH_KEY: <run `rake newkey:hash` to generate>
  TOKEN_KEY: <run `rake newkey:token` to generate>
  SECURE_SCHEME: HTTP
  RESEND_API_URL: https://api.resend.com/emails
  RESEND_API_KEY: <set in env>
  RESEND_FROM_EMAIL: <sender@yourdomain.com>
  RESEND_FROM_NAME: Fintrack-Demo
  # Any placeholder works in test: the suite mints its own tokens with a
  # matching `aud` and stubs Google's JWKS endpoint — no real client needed.
  GOOGLE_CLIENT_ID: test-client-id.apps.googleusercontent.com
  # Test holds BOTH halves so specs can forge a valid client signature.
  SIGNING_KEY: <private half of a throwaway test keypair from `rake newkey:signing`>
  VERIFY_KEY: <public half of that same test keypair>

production:
  DATABASE_URL: <set via `heroku config:set` — Heroku Postgres addon populates automatically>
  SECURE_DB_KEY: <set via `heroku config:set SECURE_DB_KEY=...`>
  SECURE_HASH_KEY: <set via `heroku config:set SECURE_HASH_KEY=...`>
  TOKEN_KEY: <set via `heroku config:set TOKEN_KEY=...`>
  SECURE_SCHEME: HTTPS
  RESEND_API_URL: https://api.resend.com/emails
  RESEND_API_KEY: <set via `heroku config:set RESEND_API_KEY=...`>
  RESEND_FROM_EMAIL: <set via `heroku config:set RESEND_FROM_EMAIL=...`>
  RESEND_FROM_NAME: Fintrack-Demo
  GOOGLE_CLIENT_ID: <set via `heroku config:set GOOGLE_CLIENT_ID=...`>
  VERIFY_KEY: <set via `heroku config:set VERIFY_KEY=...`; app holds the SIGNING_KEY>
